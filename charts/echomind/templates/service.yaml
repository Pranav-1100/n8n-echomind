apiVersion: v1
kind: Service
metadata:
  name: {{ include "echomind.fullname" . }}
  labels:
    {{- include "echomind.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "echomind.n8n.selectorLabels" . | nindent 4 }}
