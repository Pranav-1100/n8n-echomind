{{- /*
Secrets generated inside the cluster on first install and reused on every
upgrade, so they never appear in git, values files or CI logs. "keep" stops
helm uninstall from deleting them: the Postgres volume still expects the old
passwords, and losing the encryption key makes every stored credential
unreadable.
*/ -}}
{{- $dbName := include "echomind.dbSecretName" . }}
{{- $db := lookup "v1" "Secret" .Release.Namespace $dbName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels:
    {{- include "echomind.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $db $db.data }}
  n8n-password: {{ index $db.data "n8n-password" }}
  echomind-password: {{ index $db.data "echomind-password" }}
  {{- else }}
  n8n-password: {{ randAlphaNum 32 | b64enc | quote }}
  echomind-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
---
{{- $keyName := include "echomind.encryptionKeySecretName" . }}
{{- $key := lookup "v1" "Secret" .Release.Namespace $keyName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keyName }}
  labels:
    {{- include "echomind.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $key $key.data }}
  key: {{ index $key.data "key" }}
  {{- else }}
  key: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
