apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "echomind.fullname" . }}
  labels:
    {{- include "echomind.labels" . | nindent 4 }}
data:
  # n8n's own state (workflows, encrypted credentials, executions)
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: {{ include "echomind.postgres.host" . | quote }}
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  # EchoMind's application data (memories, vectors, error log), used by the
  # workflows through the "EchoMind memory database" credential
  ECHOMIND_DB_HOST: {{ include "echomind.postgres.host" . | quote }}
  ECHOMIND_DB_PORT: "5432"
  ECHOMIND_DB_NAME: echomind
  ECHOMIND_DB_USER: echomind
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  ECHOMIND_ACTIVE_WORKFLOWS: {{ join " " .Values.n8n.activeWorkflows | quote }}
  # Server
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_WEBHOOK_URL: {{ .Values.n8n.publicUrl | quote }}
  N8N_EDITOR_BASE_URL: {{ .Values.n8n.publicUrl | quote }}
  # Plain HTTP on localhost only; behind TLS this must be "true".
  N8N_SECURE_COOKIE: "false"
  GENERIC_TIMEZONE: {{ .Values.timezone | quote }}
  TZ: {{ .Values.timezone | quote }}
  # Hardening and housekeeping
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: {{ .Values.n8n.executionsMaxAgeHours | quote }}
  # Observability
  N8N_LOG_LEVEL: {{ .Values.n8n.logLevel | quote }}
  N8N_LOG_OUTPUT: console
  N8N_LOG_FORMAT: json
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
  N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: "true"
  N8N_OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  N8N_OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
