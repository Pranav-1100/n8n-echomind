# OpenTelemetry Collector (one per node) that feeds the LGTM stack:
#   metrics: scrapes n8n's Prometheus endpoint every 15s
#   logs:    tails the EchoMind pods' log files on the node
# and forwards both over OTLP to lgtm. n8n sends its traces to lgtm directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
# The collector never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Remembers how far each log file was read, so a container restart
      # does not re-send old lines.
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true

    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: n8n
              scrape_interval: 15s
              metrics_path: /metrics
              static_configs:
                - targets: ["echomind.echomind.svc.cluster.local:5678"]
      filelog:
        include:
          - /var/log/pods/echomind_*/*/*.log
        start_at: beginning
        include_file_path: true
        storage: file_storage
        operators:
          # Parses the container runtime log format and sets
          # k8s.namespace.name / k8s.pod.name / k8s.container.name from the path.
          - id: container-parser
            type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Logs only: metrics keep service.name=n8n from the scrape job, which
      # Prometheus turns into job="n8n".
      resource/echomind-logs:
        attributes:
          - key: service.name
            value: echomind
            action: upsert

    exporters:
      otlphttp:
        endpoint: http://lgtm.observability.svc.cluster.local:4318

    service:
      extensions: [health_check, file_storage]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, resource/echomind-logs, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        # Pod log files on the node are owned by root with mode 0640, so the
        # collector has to run as uid 0 to read them. It gets no capabilities,
        # no privilege escalation and a read-only root filesystem, and the log
        # directory is mounted read-only. Trivy rates the remaining findings
        # (KSV-0012 root user, KSV-0023 hostPath, KSV-0105) MEDIUM/LOW, below
        # the CI gate of HIGH.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/conf/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol/file_storage
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: storage
          emptyDir:
            sizeLimit: 64Mi
