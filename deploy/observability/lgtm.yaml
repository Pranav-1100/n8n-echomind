# All-in-one telemetry backend: OpenTelemetry Collector -> Prometheus (metrics),
# Tempo (traces), Loki (logs) -> Grafana. Adapted from
# https://github.com/grafana/docker-otel-lgtm/blob/main/k8s/lgtm.yaml (Apache-2.0).
# Intended for local/demo use: data lives in emptyDir and is lost on restart.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observability
spec:
  selector:
    app: lgtm
  ports:
    - name: otel-grpc
      port: 4317
      targetPort: 4317
    - name: otel-http
      port: 4318
      targetPort: 4318
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: prometheus
      port: 9090
      targetPort: 9090
    - name: tempo
      port: 3200
      targetPort: 3200
---
# Grafana on http://localhost:3300 via the kind port mapping (127.0.0.1 only).
apiVersion: v1
kind: Service
metadata:
  name: lgtm-grafana
  namespace: observability
spec:
  type: NodePort
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.36.0
          env:
            # Send Grafana's own log to stdout (off by default in this image).
            - name: ENABLE_LOGS_GRAFANA
              value: "true"
          # The upstream image runs as root and writes to its own filesystem,
          # so non-root and a read-only root filesystem are not possible here
          # (accepted in .trivyignore.yaml). Everything else is locked down.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Grafana's plugin installer replaces its bundled datasource plugins
              # (Prometheus, Loki, Tempo) at start-up; without these file-ownership
              # capabilities the replace fails and the datasources stop working.
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          ports:
            - containerPort: 3000
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 9090
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tempo-data
              mountPath: /data/tempo
            - name: grafana-data
              mountPath: /data/grafana
            - name: loki-data
              mountPath: /data/loki
            - name: loki-storage
              mountPath: /loki
            - name: p8s-storage
              mountPath: /data/prometheus
            - name: pyroscope-storage
              mountPath: /data/pyroscope
            # EchoMind dashboard and alert rules, provisioned from git.
            - name: grafana-echomind
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/echomind.yaml
              subPath: dashboard-provider.yaml
            - name: grafana-echomind
              mountPath: /otel-lgtm/echomind-dashboards/echomind-dashboard.json
              subPath: echomind-dashboard.json
            - name: grafana-echomind
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/echomind-alerts.yaml
              subPath: echomind-alerts.yaml
      volumes:
        - name: grafana-echomind
          configMap:
            name: grafana-echomind
        - name: tempo-data
          emptyDir: {}
        - name: grafana-data
          emptyDir: {}
        - name: loki-data
          emptyDir: {}
        - name: loki-storage
          emptyDir: {}
        - name: p8s-storage
          emptyDir: {}
        - name: pyroscope-storage
          emptyDir: {}
